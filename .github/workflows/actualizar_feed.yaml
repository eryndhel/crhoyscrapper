name: Actualizar Feed RSS de CRHoy

on:
  schedule:
    # Se ejecuta al minuto 0 de cada hora (formato UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-y-despliegue:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de scraping
        run: |
          python scraper_crhoy.py

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p public
          mv feed_crhoy_nacionales.xml public/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
